[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "data-platform-agent"
version = "0.1.0"
description = "the data platform agent."
authors = ["Anti Liu <anti.liu@x-humanoid.com>"]
readme = "README.md"
packages = [{include = "util"}]


[tool.poetry.dependencies]
python = ">=3.9,<3.14"
fastapi = ">=0.115.12,<0.116.0"
uvicorn = {extras = ["standard"], version = ">=0.34.0,<0.35.0"}
pyinstaller = ">=6.12.0,<7.0.0"
python-dotenv = "^1.1.0"

[tool.poetry.scripts]
start = "agent.main:main"
build = "scripts.build_binary:main"

